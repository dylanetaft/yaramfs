# Example install.conf / drop-in for yaramfs.
# Prefer: /etc/kernel/install.conf.d/yaramfs.conf
# Or merge into /etc/kernel/install.conf (copy other settings if replacing wholesale).
#
# initrd_generator / layout / uki_generator are installkernel settings.
# yaramfs_root is read by the yaramfs plugin only (not passed through by installkernel).
# The plugin still does not call ukify — uki_generator=ukify selects the separate
# ukify plugin, which consumes the staged initrd.

layout=uki
initrd_generator=yaramfs
uki_generator=ukify

# Path to the yaramfs tree (directory containing prepare.sh)
yaramfs_root=/opt/yaramfs
